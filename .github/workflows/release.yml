name: Release

# Läuft bei jedem Versions-Tag: baut die App und das Installationspaket und
# veröffentlicht beides als GitHub-Release in genau dem Repository, in dem der
# Tag liegt. Dev-Patches wie v1.2.0-dev werden nur im privaten Repository
# SchoolManager-dev getaggt und sind darum öffentlich weder zu sehen noch
# herunterzuladen.
#
# Variable SERVER_URL (Settings → Secrets and variables → Actions → Variables),
# in beiden Repositories: die Adresse des School-Manager-Servers, etwa
# https://schoolmanager-admin.azurewebsites.net. Über ihn melden sich Entwickler
# an und bekommen ihre freigegebenen Dev-Patches; im Programm steckt kein
# Zugang zu GitHub mehr.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version aus dem Tag lesen
        id: version
        shell: pwsh
        run: |
          # Das Installationspaket verlangt eine rein numerische Version, darum
          # faellt ein Zusatz wie "-dev" hier weg: v1.2.0-dev wird zu 1.2.0.
          $version = "${{ github.ref_name }}".TrimStart("v") -replace '-.*$', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          # Mit Zusatz fuer die Produktversion: daran erkennt die App einen Dev-Patch.
          "full=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_OUTPUT

      - name: WiX-Werkzeug installieren
        run: dotnet tool install --global wix --version 5.0.2

      - name: App veröffentlichen
        run: >
          dotnet publish SchoolManager.App\SchoolManager.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.full }}
          -p:ServerUrl=${{ vars.SERVER_URL }}
          --output publish

      - name: Installationspaket bauen
        run: >
          wix build installer\SchoolManager.wxs
          -d ExeFile="${{ github.workspace }}\publish\SchoolManager.exe"
          -d IconFile="${{ github.workspace }}\SchoolManager.App\app.ico"
          -d Version=${{ steps.version.outputs.version }}
          -pdbtype none
          -o publish\SchoolManagerSetup.msi

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: School Manager ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-dev') }}
          files: |
            publish/SchoolManager.exe
            publish/SchoolManagerSetup.msi
